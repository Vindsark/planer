name: release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go vet ./...
      - run: ./scripts/build.sh
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Скачайте файл для своей системы и запустите. Подробности в README."
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            gh release create "$GITHUB_REF_NAME" dist/* --title "Планер $GITHUB_REF_NAME" --notes "$notes"
          else
            gh release delete latest --cleanup-tag --yes || true
            gh release create latest dist/* --target "$GITHUB_SHA" --latest --title "Планер" --notes "$notes"
          fi
